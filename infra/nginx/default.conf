server {
    listen 8443 ssl;
    server_name localhost;

    ssl_certificate     /etc/nginx/certs/server.pem;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    client_max_body_size 10m;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;

    location /auth   { proxy_pass http://backend:8000; }
    location /files  { proxy_pass http://backend:8000; }
    location /logs   { proxy_pass http://backend:8000; }
    location /admin  { proxy_pass http://backend:8000; }
    location /health { proxy_pass http://backend:8000; }
    location /docs   { proxy_pass http://backend:8000; }
    location /openapi.json { proxy_pass http://backend:8000; }

    location / {
        proxy_pass http://frontend:80;
    }
}
